[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["pyepwmorph/*"]

# hatchling 1.32 defaults to core metadata 2.5, which twine below 7.0 rejects,
# including the twine inside pypa/gh-action-pypi-publish. Stay on 2.4 until the
# upload path supports 2.5.
[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[project]
name = "pyepwmorph"
version = "3.0.0"
authors = [
  { name="Justin McCarty", email="mccarty.justin.f@gmail.com" },
]
description = "A python package to enable simple and easy gathering of climate model data and morphing of EPW files"
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    # Core data processing
    # pandas 2.2 is the floor for the "ME"/"h" resample aliases used throughout
    'numpy>=1.24',
    'pandas>=2.2',

    # CMIP6 access from the Pangeo catalogue on Google Cloud
    'xarray>=2022.3.0',
    'dask>=2023.5.0',
    'gcsfs>=2023.5.0',
    'intake-esm>=2023.6.0',
    'intake>=0.6.0',
    'pyarrow>=13.0.0',

    # Solar geometry
    'pvlib>=0.13.0,<1.0.0',
]

[project.optional-dependencies]
dev = [
    'ipykernel>=6.20.0',
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=0.10",
    "twine>=4.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/justinfmccarty/pyepwmorph"
Issues = "https://github.com/justinfmccarty/pyepwmorph/issues"
Changelog = "https://github.com/justinfmccarty/pyepwmorph/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:pyepwmorph.*",
]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",    # long lines are tolerated in the numpydoc blocks
    "UP006",   # typing.Dict/List stay until the 3.9 floor is raised
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
